version: "3.8"

services:
  postgres:
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pcp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-pocketchange_prod}

  arbitrage-engine:
    build:
      context: .
      dockerfile: ./engine-worker/Dockerfile
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      RUST_LOG: info
      DATABASE_URL: postgres://${POSTGRES_USER:-pcp}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-pocketchange_prod}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:?Set SOLANA_RPC_URL in .env}
      PCP_ALLOCATION_FILE: /app/optimized-jupiter-bot/signals/allocation.json
