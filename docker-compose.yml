version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pcp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-pocketchange}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pcp} -d ${POSTGRES_DB:-pocketchange}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  engine-worker:
    build:
      context: ./engine-worker
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-pcp}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-pocketchange}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:?Set SOLANA_RPC_URL in .env}
      REDIS_URL: redis://redis:6379
      NEXTJS_API_URL: http://web:3000
      PCP_ALLOCATION_FILE: /app/optimized-jupiter-bot/signals/allocation.json
    volumes:
      - ./optimized-jupiter-bot/signals:/app/optimized-jupiter-bot/signals
      - ./.swarm:/app/.swarm
      - shared_telemetry:/app/telemetry

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      engine-worker:
        condition: service_started
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_NETWORK: ${NEXT_PUBLIC_NETWORK:-mainnet-beta}
      DATABASE_URL: postgres://${POSTGRES_USER:-pcp}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-pocketchange}
      REDIS_URL: redis://redis:6379
    volumes:
      - ./signals:/app/signals
      - ./optimized-jupiter-bot/signals:/app/optimized-jupiter-bot/signals
      - ./.swarm:/app/.swarm
      - shared_telemetry:/app/engine-worker

volumes:
  pgdata:
  redisdata:
  shared_telemetry:
