version: '3.8'

services:
  postgres:
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pcp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-pocketchange_dev}
    volumes:
      - pgdata_dev:/var/lib/postgresql/data

  web:
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-pcp}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-pocketchange_dev}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata_dev:
